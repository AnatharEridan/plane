name: Build Preview Images

on:
  workflow_dispatch:
    inputs:
      aio_build:
        description: "Build AIO (all-in-one) image"
        required: false
        default: true
        type: boolean
      arm64:
        description: "Also build for ARM64"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    name: Build Setup
    runs-on: ubuntu-22.04
    outputs:
      image_owner: ${{ steps.vars.outputs.image_owner }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      buildx_platforms: ${{ steps.vars.outputs.buildx_platforms }}
      aio_build: ${{ steps.vars.outputs.aio_build }}
    steps:
      - name: Set variables
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9.-]//g')
          echo "image_owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${BRANCH}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event.inputs.arm64 }}" = "true" ]; then
            echo "buildx_platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "buildx_platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "aio_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "aio_build=${{ github.event.inputs.aio_build }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.image_name }}
    runs-on: ubuntu-22.04
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: plane-admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - image_name: plane-frontend
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - image_name: plane-space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - image_name: plane-live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          - image_name: plane-backend
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
          - image_name: plane-proxy
            context: ./apps/proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ needs.setup.outputs.buildx_platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.setup.outputs.image_owner }}/${{ matrix.image_name }}:${{ needs.setup.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.setup.outputs.image_owner }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}

  build_aio:
    if: needs.setup.outputs.aio_build == 'true'
    name: Build plane-aio
    runs-on: ubuntu-22.04
    needs: [setup, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare AIO assets
        run: |
          cd deployments/aio/community
          bash ./build.sh --release "${{ needs.setup.outputs.image_tag }}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push AIO
        uses: docker/build-push-action@v7
        with:
          context: ./deployments/aio/community
          file: ./deployments/aio/community/Dockerfile
          platforms: ${{ needs.setup.outputs.buildx_platforms }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.setup.outputs.image_owner }}/plane-aio:${{ needs.setup.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.setup.outputs.image_owner }}/plane-aio:${{ github.sha }}
          build-args: |
            PLANE_VERSION=${{ needs.setup.outputs.image_tag }}
            IMAGE_REGISTRY=${{ env.REGISTRY }}
            IMAGE_OWNER=${{ needs.setup.outputs.image_owner }}
          cache-from: type=gha,scope=plane-aio
          cache-to: type=gha,mode=max,scope=plane-aio

  summary:
    name: Build Summary
    runs-on: ubuntu-22.04
    needs: [setup, build, build_aio]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.build_aio.result == 'success' || needs.build_aio.result == 'skipped')
    steps:
      - name: Print image URLs
        run: |
          OWNER="${{ needs.setup.outputs.image_owner }}"
          TAG="${{ needs.setup.outputs.image_tag }}"
          REGISTRY="${{ env.REGISTRY }}"

          echo "## Published images" >> "$GITHUB_STEP_SUMMARY"
          for img in plane-admin plane-frontend plane-space plane-live plane-backend plane-proxy; do
            echo "- \`${REGISTRY}/${OWNER}/${img}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${{ needs.build_aio.result }}" = "success" ]; then
            echo "- \`${REGISTRY}/${OWNER}/plane-aio:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
